# Set MODEL, IP_FILE, ENV_BIN and output/data paths before running.
model = "/path/to/local/model"
ip_file = "/path/to/worker-hosts.txt"

[runtime]
env_bin = "/path/to/python-env/bin"
cuda_fallback_ld_path = ""

[dataset]
base = "/path/to/dataset"
files = ["train.jsonl"]

[output]
allowed_output_root = "/path/to/output"
work_root = "/path/to/output/work"
raw_shards_dir = "/path/to/output/work/raw_shards"
cached_shards_dir = "/path/to/output/work/cached_shards"
final_out_dir = "/path/to/output/cached_dataset"
log_dir = "/path/to/output/logs"
local_work_root = "/tmp/swift-role-cache"

[build]
total_shards = 4
copy_parallel = 1
save_num_proc = 1
auto_merge = true
stale_task_seconds = 1800
heartbeat_seconds = 30
progress_interval_seconds = 30
max_worker_rounds = 3
split_buffer_bytes = 4194304
split_num_proc = 1
split_chunk_bytes = 1073741824
split_worker_buffer_bytes = 4194304
merge_group_size = 4

[export]
template = "qwen3_5"
agent_template = "qwen3_5"
loss_scale = "role"
role_loss_config = "./role_loss_config_sft0_equiv.json"
materialize_role_weights = true
max_length = 32768
truncation_strategy = "delete"
dataset_num_proc = 1
dataset_shuffle = true
data_seed = 20261118
split_dataset_ratio = 0.0
load_from_cache_file = true
to_cached_dataset = true
